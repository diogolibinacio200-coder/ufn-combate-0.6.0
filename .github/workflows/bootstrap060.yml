name: Preparar base UFN Combate 0.6.0
on:
  push:
    paths:
      - '.github/workflows/bootstrap060.yml'
permissions:
  contents: write
jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Copiar a base pública verificada
        run: |
          git clone --depth 1 https://github.com/diogolibinacio200-coder/ufn-combate-0.5.0.git /tmp/ufn-base
          test "$(git -C /tmp/ufn-base rev-parse HEAD)" = "6f20244e94a63065d9a2f7aebe78276948e3e458"
          rsync -a --exclude='.git' --exclude='.github' /tmp/ufn-base/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preservar base UFN Combate 0.5.0 para atualização 0.6.0'
          git push
